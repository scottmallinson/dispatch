name: Release

# On every push to main, semantic-release cuts a release when a commit is
# releasable (see .releaserc.json and docs/adr/0004-automatic-releases.md).
# When it does, the installers for macOS and Windows are built from that tag and
# attached to the GitHub Release. Pushes that do not release build nothing.

on:
  push:
    branches: [main]
  # Builds the installers for a release that already exists, for example when
  # an earlier release shipped without them. Builds from the main branch.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach installers to, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD | head -n1)" >> "$GITHUB_OUTPUT"

  installers:
    name: Installers (${{ matrix.target }})
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.tag != '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      # A push builds from the tag it just released. A manual run builds from
      # main, which has the same app source as the older tags it re-packages.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # semantic-release tags the version but does not write it to package.json,
      # and electron-builder names the files from that field.
      - run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm run build
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The release job publishes the GitHub Release. When that did not happen
        # (the tag exists but no release does), create it from the tag here. The
        # Windows and macOS jobs run together, so whichever loses the race finds
        # the release the other created.
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes \
            || gh release view "$TAG" > /dev/null
          find release -maxdepth 1 \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | xargs -0 -r gh release upload "$TAG" --clobber
