# Installers for the release workflow (.github/workflows/release.yml).
# Builds are unsigned for now: macOS shows a Gatekeeper warning and Windows a
# SmartScreen warning until signing certificates are added.
appId: com.scottmallinson.dispatch
productName: Dispatch
copyright: Copyright © Scott Mallinson
directories:
  output: release
  # icon.png (1024 x 1024) is the source for the macOS icns, the dmg and the
  # Windows exe and installer icons; electron-builder derives each from it, as
  # Bureau's installers do. icon.svg is the editable source of the PNG.
  buildResources: build-resources
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
# The dispatch:// scheme opens the composer from Bureau's calendar. macOS reads it
# from the app's Info.plist, so it must be declared here, not only at run time.
protocols:
  - name: Dispatch
    schemes:
      - dispatch
# Where installed apps look for updates. The workflow publishes the update
# metadata (latest*.yml, the zip and the blockmaps) into the GitHub Release.
publish:
  provider: github
  owner: scottmallinson
  repo: dispatch
mac:
  target:
    - target: dmg
      arch: universal
    # Updates on macOS install from the zip, not the dmg.
    - target: zip
      arch: universal
  category: public.app-category.productivity
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
# The installer's name has no spaces. GitHub turns the spaces in an uploaded
# file's name into dots, so the name in latest.yml did not match the release
# asset and every Windows update download returned 404.
nsis:
  artifactName: 'Dispatch-Setup-${version}.${ext}'
